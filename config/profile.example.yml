# Career-Ops Profile Configuration
# Copy this file to config/profile.yml and fill in your details.
# This is the single source of truth for your personal data across all modes.

candidate:
  full_name: "Jane Smith"
  email: "jane@example.com"
  phone: "+1-555-0123"
  location: "San Francisco, CA"
  linkedin: "linkedin.com/in/janesmith"
  portfolio_url: "https://janesmith.dev"
  github: "github.com/janesmith"
  # One sentence, used verbatim in every cover letter. State your real position.
  right_to_work_line: "I have the right to work in the UK and am available immediately. I would welcome the chance to talk about the role."
  twitter: "https://x.com/janesmith"
  # (Optional) Canva resume design ID for visual CV generation via /career-ops pdf.
  # Find it in your Canva design URL: https://www.canva.com/design/DAxxxxxxx/...
  # The ID starts with "D" and is 11 characters long.
  # canva_resume_design_id: "DAxxxxxxxxx"

target_roles:
  # Your North Star roles — what you're optimizing for
  primary:
    - "Senior AI Engineer"
    - "Staff ML Engineer"
  # Archetypes help the evaluation system score fit
  archetypes:
    - name: "AI/ML Engineer"
      level: "Senior/Staff"
      fit: "primary"        # primary = dream role, secondary = good fit, adjacent = stretch
    - name: "AI Product Manager"
      level: "Senior"
      fit: "secondary"
    - name: "Solutions Architect"
      level: "Mid-Senior"
      fit: "adjacent"

narrative:
  # Your professional headline (1 line)
  headline: "ML Engineer turned AI product builder"
  # Your exit story — what makes you unique
  exit_story: "Built and sold my SaaS after 5 years. Now focused on applied AI at scale."
  # Your top 3-5 superpowers
  superpowers:
    - "End-to-end ML pipelines"
    - "Fast prototyping (idea to prod in 2 weeks)"
    - "Cross-functional communication"
  # Proof points — projects, articles, case studies with measurable impact
  proof_points:
    - name: "Project Alpha"
      url: "https://janesmith.dev/project-alpha"
      hero_metric: "Reduced inference latency 40%"
    - name: "Open Source Tool"
      url: "https://github.com/janesmith/tool"
      hero_metric: "2K+ GitHub stars"
  # Optional: dashboard/demo URL with credentials
  # dashboard:
  #   url: "https://janesmith.dev/demo"
  #   password: "demo-2026"

compensation:
  target_range: "$150K-200K"     # Your target total comp
  currency: "USD"
  minimum: "$120K"               # Walk-away number
  location_flexibility: "Remote preferred, 1 week/month on-site possible"

location:
  country: "United States"
  city: "San Francisco"
  timezone: "PST"
  visa_status: "No sponsorship needed"
  # For remote roles outside your country:
  # onsite_availability: "1 week/month in any city"

# ── Lean one-page CV (tailor-v2.mjs --lean, and every grad-band advert) ─────────
# Everything here is printed as written. Keep it true; the ledger (master/bullets.yml)
# still supplies the bullets and projects. education, certifications_line and rtw_line
# are also used by the full (non-lean) CV.
lean:
  grad_headline: "MSc Data Science Graduate"
  # Three lines each. summary_grad for graduate/junior adverts, summary_mid otherwise.
  summary_grad:
    - "MSc Data Science graduate (Merit, 2025) with the Microsoft PL-300."
    - "Since graduating I have worked as a data analyst for consultancy clients, building reporting and the data behind it."
    - "I work in SQL, Python and Power BI, and explain results to people who are not technical."
  summary_mid:
    - "Data analyst with an MSc in Data Science (Merit, 2025) and the Microsoft PL-300."
    - "I build reporting, reconciliations and data pipelines for consultancy clients."
    - "I work in SQL, Python and Power BI, and explain results to people who are not technical."
  # Ledger role ids starting with this prefix feed the lean CV (blank = every role at your newest employer).
  primary_role_prefix: "current_"
  primary_role_heading: "Example Analytics Ltd | Data Analyst @@ March 2025 - Present"
  primary_role_note: "data and automation consultancy"
  # Bullets whose text matches any of these (case-insensitive regex) are left off the lean CV.
  drop_bullet_patterns: ["team of", "portfolio of"]
  # Optional [regex, replacement] pairs that shorten long ledger sentences for the one-page CV.
  bullet_trims:
    - [", which now runs on a schedule and saves the client around eight hours a week", ""]
  # Same idea, applied to project write-ups only.
  project_trims: []
  exclude_project_ids: []
  education:
    - heading: "Example University, Exampletown | MSc Data Science @@ September 2023 - September 2024"
      grade_line: "Grade: Merit"
      grad_only_bullets:
        - "Dissertation: analysed an open dataset with Python and statistical tests."
    - heading: "Example College | BSc Mathematics @@ September 2019 - June 2022"
      grade_line: "Grade: 2:1"
  certifications_line: "Microsoft Certified: Power BI Data Analyst Associate (PL-300)  ·  Example Certificate"
  # Optional. Defaults to candidate.right_to_work_line.
  # rtw_line: "Eligible to work in the UK. Available immediately."
